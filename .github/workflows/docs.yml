name: Documentation checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @mintlify/cli@4
      - run: bash scripts/check-public-copy.sh
      - run: mint validate
      - run: mint broken-links --check-anchors --check-redirects
      - run: mint a11y
